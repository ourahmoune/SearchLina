name: 🏠 CROUS Tours Monitor

on:
  schedule:
    # Minutes décalées pour éviter les pics de charge de GitHub (:00, :15, :30, :45)
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

# Évite que deux exécutions se chevauchent (conflits sur seen.json)
concurrency:
  group: crous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: 📂 Initialiser seen.json si absent
        run: |
          [ -f seen.json ] || echo "[]" > seen.json

      - name: 🔍 Vérification des offres CROUS
        env:
          EMAIL: ${{ secrets.EMAIL }}
          MOT_DE_PASSE_APP: ${{ secrets.MOT_DE_PASSE_APP }}
        run: python crous_monitor.py

      - name: 💾 Sauvegarder seen.json
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add seen.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans seen.json"
          else
            git commit -m "🔄 Mise à jour seen.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
